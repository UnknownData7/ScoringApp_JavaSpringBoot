<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Скоринг заявки</title>
    <style>
        :root {
            --navy: #0b4a9a;
            --cyan: #0a9bd8;
            --orange: #ff5a1f;
            --text: #14202e;
            --muted: #5b6b7c;
            --ok: #1a8f4c;
            --warn: #d98a00;
            --bad: #c62828;
        }
        body { font-family: "Segoe UI", Arial, sans-serif; margin: 0; color: var(--text);
            background: linear-gradient(160deg, #eaf5fd 0%, #cde6f7 100%); min-height: 100vh; }
        header { background: #fff; padding: 14px 32px; display: flex;
            justify-content: space-between; align-items: center; }
        header img { height: 28px; }
        .pill { background: var(--cyan); color: #fff; padding: 8px 18px;
            border-radius: 999px; font-size: 14px; font-weight: 600; }
        main { max-width: 560px; margin: 0 auto; padding: 32px 20px 48px; }
        .eyebrow { display: flex; align-items: center; gap: 10px; font-size: 12px;
            letter-spacing: 1.5px; text-transform: uppercase; color: var(--navy); font-weight: 700; }
        .eyebrow::before { content: ""; width: 28px; height: 2px; background: var(--orange); }
        h1 { font-size: 34px; line-height: 1.15; margin: 12px 0 8px; font-weight: 800; }
        h1 .accent { color: var(--cyan); }
        .subtitle { color: var(--muted); margin: 0 0 24px; }
        .card { background: #fff; padding: 24px; border-radius: 20px;
            box-shadow: 0 8px 24px rgba(11, 74, 154, 0.12); }
        label { display: block; margin-top: 14px; font-size: 13px; color: var(--muted); font-weight: 600; }
        input { width: 100%; padding: 12px 14px; box-sizing: border-box; margin-top: 6px;
            border: 1px solid #d5e0ec; border-radius: 12px; font-size: 15px; }
        input:focus { outline: none; border-color: var(--cyan); }
        button { margin-top: 24px; width: 100%; padding: 15px; background: var(--navy);
            color: #fff; border: none; border-radius: 999px; font-size: 16px;
            font-weight: 600; cursor: pointer; }
        button:hover { background: #083a78; }
        #result { margin-top: 20px; padding: 14px 16px; border-radius: 12px; display: none;
            border-left: 6px solid #999; background: #f0f0f0; }
        #result.APPROVED { border-left-color: var(--ok); background: #e8f5ee; }
        #result.MANUAL_REVIEW { border-left-color: var(--warn); background: #fff4e0; }
        #result.REJECTED { border-left-color: var(--bad); background: #fdeaea; }
        #result ul { margin: 8px 0 0; padding-left: 20px; }
    </style>
</head>
<body>
<header>
    <img src="tkb_logo.png" alt="Логотип банка">
    <span class="pill">Кредитный скоринг</span>
</header>

<main>
    <div class="eyebrow">Оценка заявки</div>
    <h1>Рассчитайте решение по <span class="accent">кредиту</span></h1>
    <p class="subtitle">Введите данные заявки, и сервис оценит риск по правилам скоринга.</p>

    <div class="card">
        <label>Возраст <input type="number" id="age" value="30"></label>
        <label>Ежемесячный доход <input type="number" id="monthlyIncome" value="100000"></label>
        <label>Стаж, месяцев <input type="number" id="workExperienceMonths" value="36"></label>
        <label>Сумма кредита <input type="number" id="loanAmount" value="500000"></label>
        <label>Срок, месяцев <input type="number" id="termMonths" value="24"></label>
        <label>Текущие платежи в месяц <input type="number" id="existingMonthlyPayments" value="0"></label>
        <label>Количество просрочек <input type="number" id="overdueCount" value="0"></label>

        <button onclick="sendApplication()">Рассчитать →</button>

        <div id="result"></div>
    </div>
</main>

<script>
    async function sendApplication() {
        const application = {
            age: Number(document.getElementById("age").value),
            monthlyIncome: Number(document.getElementById("monthlyIncome").value),
            workExperienceMonths: Number(document.getElementById("workExperienceMonths").value),
            loanAmount: Number(document.getElementById("loanAmount").value),
            termMonths: Number(document.getElementById("termMonths").value),
            existingMonthlyPayments: Number(document.getElementById("existingMonthlyPayments").value),
            overdueCount: Number(document.getElementById("overdueCount").value)
        };

        const response = await fetch("/api/scoring", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(application)
        });

        const resultDiv = document.getElementById("result");
        resultDiv.style.display = "block";

        if (!response.ok) {
            resultDiv.className = "";
            resultDiv.textContent = "Ошибка запроса: " + response.status;
            return;
        }

        const result = await response.json();
        resultDiv.className = result.decision;

        let html = "<b>Решение: " + result.decision + "</b><br>";
        html += "Итоговый балл: " + result.totalScore + "<ul>";
        for (const rule of result.ruleResults) {
            html += "<li>" + rule.ruleName + ": " + rule.points + " — " + rule.comment + "</li>";
        }
        html += "</ul>";
        resultDiv.innerHTML = html;
    }
</script>
</body>
</html>
